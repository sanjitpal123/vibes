<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Vibes Healthcare</title>
    <meta
      name="description"
      content="Thank you for contacting Vibes Healthcare."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }
      .thank-you-container {
        background: white;
        padding: 50px 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        max-width: 500px;
        width: 90%;
      }
      .thank-you-container h1 {
        font-family: 'Playfair Display', serif;
        color: #2D2C6C;
        margin-bottom: 20px;
        font-size: 36px;
      }
      .thank-you-container p {
        color: #555;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      .btn-home {
        display: inline-block;
        background-color: #e75524;
        color: white;
        padding: 12px 30px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.3s ease;
      }
      .btn-home:hover {
        background-color: #c9461b;
      }
    </style>
  </head>
  <body>
    <div class="thank-you-container">
      <h1>Thank You!</h1>
      <p>Your request has been successfully submitted. Our team will get back to you shortly to assist you further.</p>
      <a href="index.html" class="btn-home">Return to Homepage</a>
    </div>
  </body>
</html>
